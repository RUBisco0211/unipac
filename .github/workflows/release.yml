name: Release

# Packaging pipeline: builds the macOS arm64 disk image, runs the checks, and
# publishes it as a GitHub release for the pushed tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match "version" in mygo.json; the first step fails otherwise.
# Run the workflow from the Actions tab to build without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the disk image to it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64
    # macos-14 is an Apple Silicon runner. Signing, notarization and the disk
    # image all need macOS, so this job cannot move to Linux.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes compare against the previous tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go tool mygo vet .

      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test ./...

      # No Developer ID certificate is configured, so mygo build signs ad hoc:
      # the app runs, but Gatekeeper blocks it on other Macs until the user
      # allows it. To ship a signed, notarized build, import the certificate
      # into a keychain before this step and set macos.signingIdentity and
      # macos.notarize in mygo.json; see "Signing and notarizing macOS apps"
      # in MyGo's docs/github-actions.md.
      - name: Build the disk image
        env:
          CGO_ENABLED: 0
        run: go tool mygo build -platform darwin/arm64

      - name: Write checksums
        run: |
          cd dist/darwin-arm64
          shasum -a 256 ./*.dmg > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: unipac-macos-arm64
          path: |
            dist/darwin-arm64/*.dmg
            dist/darwin-arm64/checksums.txt
          if-no-files-found: error

      # The draft exists before the upload, so a rerun replaces its files
      # instead of creating a second release. It is published only once the
      # disk image and the checksums are attached.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "UniPac $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            dist/darwin-arm64/*.dmg dist/darwin-arm64/checksums.txt
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
